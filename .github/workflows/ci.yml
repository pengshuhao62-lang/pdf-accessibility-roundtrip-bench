name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Compile sources
        run: python -m compileall -q src tests tools
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check

  fixture-integrity:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Verify corpus command interface
        run: |
          python - <<'PY'
          from pathlib import Path
          from pdfua_bench.corpus import load_corpus, verify_corpus_files

          corpus = load_corpus(Path("corpus/manifest.json"))
          errors = verify_corpus_files(corpus)
          if errors:
              raise SystemExit("\n".join(errors))
          print(f"Verified {len(corpus.fixtures)} corpus fixtures.")
          PY
