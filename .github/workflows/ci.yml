name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        include:
          - os: macos-14
            python: "3.9"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Compile sources
        run: python -m compileall -q src tests tools
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
      - name: Exercise composite action comparison without PDF tools
        uses: ./
        with:
          mode: compare
          before: reports/example-v0.2.0-current.json
          after: reports/example-v0.2.0-current.json
          output: lab/action-comparison.json
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Verify wheel outside source checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/python" - <<'PY'
          from pdfua_bench.cli import default_corpus, main
          from pdfua_bench.corpus import load_corpus, verify_corpus_files
          corpus = load_corpus(default_corpus())
          assert len(corpus.fixtures) == 20
          assert verify_corpus_files(corpus) == []
          assert main(["corpus-path"]) == 0
          PY

  fixture-integrity:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Verify corpus command interface
        run: |
          python - <<'PY'
          from pathlib import Path
          from pdfua_bench.corpus import load_corpus, verify_corpus_files

          corpus = load_corpus(Path("corpus/manifest.json"))
          errors = verify_corpus_files(corpus)
          if errors:
              raise SystemExit("\n".join(errors))
          print(f"Verified {len(corpus.fixtures)} corpus fixtures.")
          PY
